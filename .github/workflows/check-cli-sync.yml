name: Check CLI Sync

on:
  pull_request:
    paths:
      - "skills/ppt-master/scripts/**"
      - "cli.py"
      - "skills/ppt-master/cli.py"
      - "pyproject.toml"
      - "skills/ppt-master/pyproject.toml"

jobs:
  check:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v4
      - name: Run cli sync check
        run: python3 skills/ppt-master/scripts/check_cli_sync.py
