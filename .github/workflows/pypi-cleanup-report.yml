name: PyPI Cleanup Report

on:
  schedule:
    - cron: "17 3 1 * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  report:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install pinned uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.12.13"
          checksum: "745765a3b6e360ad76743599ae5c42e9278c7edf8bbff9fc76d05bf2623a04dd"
          enable-cache: false

      - name: Generate read-only cleanup report
        run: |
          set -euo pipefail
          REPORT_DIR="$RUNNER_TEMP/pypi-cleanup-report"
          mkdir -p "$REPORT_DIR"
          uvx --python 3.12 --from packaging==25.0 python -I \
            "$GITHUB_WORKSPACE/.github/maintenance/pypi_cleanup.py" report \
            --json "$REPORT_DIR/report.json" \
            --markdown "$REPORT_DIR/report.md"

      - name: Append report to step summary
        run: |
          set -euo pipefail
          cat "$RUNNER_TEMP/pypi-cleanup-report/report.md" >> "$GITHUB_STEP_SUMMARY"

      - name: Upload cleanup report
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: pypi-cleanup-report
          path: ${{ runner.temp }}/pypi-cleanup-report
          if-no-files-found: error
          retention-days: 35
