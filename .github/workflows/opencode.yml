name: opencode

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]

jobs:
  opencode:
    timeout-minutes: 30
    if: |
      (contains(github.event.comment.body, '/oc ') || contains(github.event.comment.body, '/oc\n') ||
       startsWith(github.event.comment.body, '/oc ') || startsWith(github.event.comment.body, '/oc\n') ||
       contains(github.event.comment.body, '/opencode ') || contains(github.event.comment.body, '/opencode\n') ||
       startsWith(github.event.comment.body, '/opencode ') || startsWith(github.event.comment.body, '/opencode\n')) &&
      contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.comment.author_association) &&
      github.event.comment.user.login != 'github-actions[bot]' &&
      github.event.comment.user.login != 'opencode-agent'
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install ripgrep
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ripgrep

      - name: Run opencode
        uses: anomalyco/opencode/github@77fc88c8ade8e5a620ebbe1197f3a572d29ae91a # github-v1.2.19
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
        with:
          model: ${{ vars.OPENCODE_MODEL || 'deepseek/deepseek-v4-flash' }}
