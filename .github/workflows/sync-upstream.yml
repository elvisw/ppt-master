name: Sync Upstream

on:
  schedule:
    # 每天 UTC 18:00（北京时间次日凌晨 02:00，避开 DeepSeek 高峰时段）
    - cron: "0 18 * * *"
  workflow_dispatch:

jobs:
  sync-upstream:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
      pull-requests: write
      id-token: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: false

      - name: Setup Python
        run: uv python install 3.12 && uv python pin 3.12

      - name: Install ripgrep
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ripgrep

      - name: Check upstream changes
        id: upstream
        run: |
          git remote add upstream https://github.com/hugohe3/ppt-master.git 2>/dev/null || true
          git fetch upstream main
          UPSTREAM_SHA=$(git rev-parse upstream/main)
          echo "upstream_sha=$UPSTREAM_SHA" >> "$GITHUB_OUTPUT"
          echo "Upstream tip: $UPSTREAM_SHA"
          CHANGES=$(git log main..upstream/main --oneline)
          if [ -z "$CHANGES" ]; then
            echo "has_changes=false" >> $GITHUB_OUTPUT
            echo "No upstream changes — skipping sync."
          else
            echo "has_changes=true" >> $GITHUB_OUTPUT
            echo "Upstream changes detected:"
            echo "$CHANGES"
          fi

      # schedule 事件：OpenCode action 自动跳过权限，创建分支+PR
      - name: Run OpenCode Sync (auto)
        if: github.event_name == 'schedule' && steps.upstream.outputs.has_changes == 'true'
        uses: anomalyco/opencode/github@latest
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          GH_TOKEN: ${{ github.token }}
        with:
          model: ${{ vars.OPENCODE_MODEL || 'deepseek/deepseek-v4-flash' }}
          prompt: |
            Read `.opencode/command/sync-upstream.md` and follow ALL steps exactly as written.
            Use `python3` not `python`. Do NOT manually create tags or push to main.
            If no upstream changes, stop immediately.

            The immutable upstream commit for this run is `${{ steps.upstream.outputs.upstream_sha }}`.
            Set `EXPECTED_UPSTREAM_SHA` to that exact value and follow `.opencode/command/sync-upstream.md`.
            CRITICAL: preserve a real merge commit whose second parent is that SHA. Never reset, rebase,
            squash, cherry-pick, switch branches, or clear MERGE_HEAD after merge starts. Do not report
            success unless the recorded SHA is an ancestor of HEAD.

            CRITICAL: In Step 4, you MUST scan ALL .md files in the entire repo (not just a few
            directories). The scan scope must include: root .md files (AGENTS.md, CLAUDE.md,
            CONTRIBUTING.md, README.md, etc.), skills/ppt-master/, docs/, examples/, projects/,
            and any other directory that contains .md files. Only exclude .opencode/,
            docs/superpowers/, and docs/zh/upstream-sync.md.

            CRITICAL: Before committing, you MUST run the Step 4e gate: verify zero python3
            remnants across the entire repo using rg. If ANY python3 remains, go back to Step 4c.
            Do NOT commit until the gate is clean.

            CRITICAL: After the python3 gate, you MUST also run the Skill integrity guard:
            `python3 skills/ppt-master/scripts/attribution_guard.py` must exit 0 (no output).
            If it exits non-zero (e.g. 78), fix the attribution/uvx conflict before committing:
            keep `_SKILL_GATE_MARKER` as `uvx ppt-master attribution-guard` in
            attribution_guard.py, ensure SKILL.md contains it exactly once, ensure
            LICENSE/SPONSORS.md/SPONSORS_CN.md exist under skills/ppt-master/, and ensure
            MANIFEST.in (root and skills/ppt-master/) still includes SKILL.md/LICENSE/
            SPONSORS.md/SPONSORS_CN.md. Re-run the guard until it exits 0.
            Do NOT commit or push until BOTH gates pass.

            CRITICAL: After the python3 and skill guard gates, verify fork adaptation markers
            still exist: grep for PPT_MASTER_LAUNCH_TOKEN in scripts/confirm_ui/server.py and
            scripts/svg_editor/server.py, grep for normalized_project_key in server_common.py,
            grep for projects_root in project_management/paths.py and config.py, and grep for
            PPT_MASTER_TEMPLATES_DIR in scripts/register_template.py. Also verify the fork
            notice blocks: README.md and README_CN.md must contain the fork notice block
            (Fork notice / Fork 声明, including the uvx ppt-master install note) right after
            the language-switch line, PYPI_README.md must keep the fork maintainer + sponsor
            attribution note at the top, docs/faq.md + docs/zh/faq.md must keep the uvx (PyPI)
            row in the update table, docs/windows-installation.md + docs/zh/windows-installation.md
            must keep the fork uvx note under the title, docs/roadmap.md + docs/zh/roadmap.md
            must keep the fork note after the uv paragraph, and CONTRIBUTING.md must keep the
            fork note after Setup. If any marker is missing, restore the fork adaptation
            before committing.

            CRITICAL: After the marker checks, verify the 8 fork-modified Python files are runnable:
            run `python3 -m py_compile` on confirm_ui/server.py, svg_editor/server.py, visual_review.py,
            server_common.py, config.py, project_management/paths.py, project_manager.py, and
            register_template.py (all under skills/ppt-master/scripts/), then run
            `uvx ruff check --select F821` on the same 8 files. F821 catches undefined names such as
            a missing `import uuid` next to a launch-token line — the marker grep alone cannot detect
            "marker present but code broken". Both checks must pass with zero errors before committing;
            fix any failure and re-run until clean.

      # workflow_dispatch 事件：opencode CLI 非交互模式
      - name: Run OpenCode Sync (manual)
        if: github.event_name == 'workflow_dispatch' && steps.upstream.outputs.has_changes == 'true'
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
        run: |
          npm install -g opencode-ai@latest
          opencode run --dangerously-skip-permissions -m ${{ vars.OPENCODE_MODEL || 'deepseek/deepseek-v4-flash' }} "Read .opencode/command/sync-upstream.md and follow ALL steps. Use python3. No tags. Stop if no upstream changes. Do not push; the workflow verifies and pushes after OpenCode exits. The immutable upstream commit for this run is ${{ steps.upstream.outputs.upstream_sha }}. Set EXPECTED_UPSTREAM_SHA to that exact value and follow .opencode/command/sync-upstream.md. CRITICAL: preserve a real merge commit whose second parent is that SHA. Never reset, rebase, squash, cherry-pick, switch branches, or clear MERGE_HEAD after merge starts. Do not report success unless the recorded SHA is an ancestor of HEAD. CRITICAL: Step 4 must scan ALL .md files in the entire repo. Before committing, run Step 4e gate — rg 'python3' across all .md files (excluding .opencode/, docs/superpowers/). Do NOT commit until clean. CRITICAL: also run the skill integrity guard via python3 skills/ppt-master/scripts/attribution_guard.py and require exit 0; if it fails, fix the attribution/uvx conflict (keep _SKILL_GATE_MARKER as uvx ppt-master attribution-guard, keep SKILL.md/LICENSE/SPONSORS files and MANIFEST.in includes) and re-run until exit 0. Do NOT commit or push until both gates pass. Also verify fork adaptation markers (PPT_MASTER_LAUNCH_TOKEN in confirm_ui/server.py + svg_editor/server.py, normalized_project_key in server_common.py, projects_root in paths.py/config.py, PPT_MASTER_TEMPLATES_DIR in register_template.py) and the fork notice blocks (Fork notice / Fork 声明 with uvx install note in README.md + README_CN.md, fork maintainer + sponsor attribution note in PYPI_README.md, uvx (PyPI) row in docs/faq.md + docs/zh/faq.md update table, fork uvx note in docs/windows-installation.md + docs/zh/windows-installation.md, fork note after uv paragraph in docs/roadmap.md + docs/zh/roadmap.md, fork note after Setup in CONTRIBUTING.md) still exist; restore them if missing before committing. CRITICAL: also verify the 8 fork-modified Python files are runnable — run python3 -m py_compile on confirm_ui/server.py, svg_editor/server.py, visual_review.py, server_common.py, config.py, project_management/paths.py, project_manager.py, register_template.py (all under skills/ppt-master/scripts/), then run uvx ruff check --select F821 on the same 8 files; F821 catches undefined names like a missing import uuid next to a launch-token line, which the marker grep cannot detect. Both checks must pass with zero errors before committing; fix any failure and re-run until clean."

      - name: Verify upstream ancestry
        if: github.event_name == 'workflow_dispatch'
        env:
          BASE_SHA: ${{ github.sha }}
          EXPECTED_UPSTREAM_SHA: ${{ steps.upstream.outputs.upstream_sha }}
        run: |
          RECORDED_SHA=$(tr -d '\r\n' < .github/upstream-main.sha)
          if [ "$RECORDED_SHA" != "$EXPECTED_UPSTREAM_SHA" ]; then
            echo "::error::Recorded SHA $RECORDED_SHA does not match expected $EXPECTED_UPSTREAM_SHA"
            exit 1
          fi
          if ! git merge-base --is-ancestor "$EXPECTED_UPSTREAM_SHA" HEAD; then
            echo "::error::Expected upstream SHA is not an ancestor of HEAD"
            git log --graph --oneline --decorate "$BASE_SHA..HEAD"
            exit 1
          fi
          MERGE_COMMIT=$(git rev-list --merges --parents "$BASE_SHA..HEAD" |
            awk -v target="$EXPECTED_UPSTREAM_SHA" '{ for (i = 2; i <= NF; i++) if ($i == target) { print $1; exit } }')
          if [ -z "$MERGE_COMMIT" ]; then
            echo "::error::No new merge commit has expected upstream SHA as a direct parent"
            git log --graph --oneline --decorate "$BASE_SHA..HEAD"
            exit 1
          fi
          echo "Verified merge commit $MERGE_COMMIT with upstream parent $EXPECTED_UPSTREAM_SHA"

      - name: Push verified manual sync
        if: github.event_name == 'workflow_dispatch'
        env:
          PUSH_PAT: ${{ secrets.PUSH_PAT }}
        run: |
          git remote set-url origin "https://x-access-token:${PUSH_PAT}@github.com/elvisw/ppt-master.git"
          git push origin HEAD:main


