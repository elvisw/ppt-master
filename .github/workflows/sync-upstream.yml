name: Sync Upstream

on:
  schedule:
    # 每天 UTC 18:00（北京时间次日凌晨 02:00，避开 DeepSeek 高峰时段）
    - cron: "0 18 * * *"
  workflow_dispatch:

jobs:
  sync-upstream:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
      pull-requests: write
      id-token: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: false

      - name: Setup Python
        run: uv python install 3.12 && uv python pin 3.12

      - name: Install ripgrep
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ripgrep

      - name: Check upstream changes
        id: upstream
        run: |
          git remote add upstream https://github.com/hugohe3/ppt-master.git 2>/dev/null || true
          git fetch upstream main
          UPSTREAM_SHA=$(git rev-parse upstream/main)
          echo "upstream_sha=$UPSTREAM_SHA" >> "$GITHUB_OUTPUT"
          echo "Upstream tip: $UPSTREAM_SHA"
          CHANGES=$(git log main..upstream/main --oneline)
          if [ -z "$CHANGES" ]; then
            echo "has_changes=false" >> "$GITHUB_OUTPUT"
            echo "No upstream changes — skipping sync."
          else
            echo "has_changes=true" >> "$GITHUB_OUTPUT"
            echo "Upstream changes detected:"
            echo "$CHANGES"
          fi

      # Both OpenCode paths may create a commit; configure commit author metadata only.
      - name: Configure git identity
        if: steps.upstream.outputs.has_changes == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      # schedule 事件：OpenCode action 自动跳过权限，创建分支+PR
      - name: Run OpenCode Sync (auto)
        if: github.event_name == 'schedule' && steps.upstream.outputs.has_changes == 'true'
        uses: anomalyco/opencode/github@latest
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          GH_TOKEN: ${{ github.token }}
          EXPECTED_UPSTREAM_SHA: ${{ steps.upstream.outputs.upstream_sha }}
        with:
          model: ${{ vars.OPENCODE_MODEL || 'deepseek/deepseek-v4-flash' }}
          prompt: |
            Read `.opencode/command/sync-upstream.md` and follow ALL steps exactly as written.
            Use `python3` not `python`. Do NOT manually create tags or push to main.
            If no upstream changes, stop immediately.

            The immutable upstream commit for this run is `${{ steps.upstream.outputs.upstream_sha }}`.
            `EXPECTED_UPSTREAM_SHA` is injected into the environment; it must equal that exact value.
            Follow `.opencode/command/sync-upstream.md`'s fail-closed Actions contract.
            CRITICAL: preserve a real merge commit whose second parent is that SHA. Never reset, rebase,
            squash, cherry-pick, switch branches, or clear MERGE_HEAD after merge starts. Do not report
            success unless the recorded SHA is an ancestor of HEAD.

            CRITICAL: In Step 4, you MUST scan ALL .md files in the entire repo (not just a few
            directories). The scan scope must include: root .md files (AGENTS.md, CLAUDE.md,
            CONTRIBUTING.md, README.md, etc.), skills/ppt-master/, docs/, examples/, projects/,
            and any other directory that contains .md files. Only exclude .opencode/,
            docs/superpowers/, and docs/zh/upstream-sync.md.

            CRITICAL: Before committing, you MUST run the Step 4e gate: verify zero python3
            remnants across the entire repo using rg. If ANY python3 remains, go back to Step 4c.
            Do NOT commit until the gate is clean.

            CRITICAL: After the python3 gate, you MUST also run the Skill integrity guard:
            `python3 skills/ppt-master/scripts/attribution_guard.py` must exit 0 (no output).
            If it exits non-zero, fix the attribution/uvx conflict and re-run the guard.
            Do NOT commit or push until BOTH gates pass.

            CRITICAL: After the python3 and skill guard gates, verify fork adaptation markers
            still exist: grep for PPT_MASTER_LAUNCH_TOKEN in scripts/confirm_ui/server.py and
            scripts/svg_editor/server.py, grep for normalized_project_key in server_common.py,
            grep for projects_root in project_management/paths.py and config.py, and grep for
            PPT_MASTER_TEMPLATES_DIR in scripts/register_template.py. Also verify the fork
            notice blocks: README.md and README_CN.md must contain the fork notice block
            (Fork notice / Fork 声明, including the uvx ppt-master install note) right after
            the language-switch line, PYPI_README.md must keep the fork maintainer + sponsor
            attribution note at the top, docs/faq.md + docs/zh/faq.md must keep the uvx (PyPI)
            row in the update table, docs/windows-installation.md + docs/zh/windows-installation.md
            must keep the fork uvx note under the title, docs/roadmap.md + docs/zh/roadmap.md
            must keep the fork note after the uv paragraph, and CONTRIBUTING.md must keep the
            fork note after Setup. If any marker is missing, restore the fork adaptation
            before committing.

            CRITICAL: After the marker checks, verify the 8 fork-modified Python files are runnable:
            run `python3 -m py_compile` on confirm_ui/server.py, svg_editor/server.py, visual_review.py,
            server_common.py, config.py, project_management/paths.py, project_manager.py, and
            register_template.py (all under skills/ppt-master/scripts/), then run
            `uvx ruff check --select F821` on the same 8 files. Both checks must pass with zero
            errors before committing; fix any failure and re-run until clean.

      # workflow_dispatch 事件：只允许从 main 运行，模型不接触 push 凭据
      - name: Guard manual sync ref
        if: github.event_name == 'workflow_dispatch'
        run: |
          if [ "${GITHUB_REF:-}" != "refs/heads/main" ]; then
            echo "::error::workflow_dispatch sync must run from refs/heads/main; got '${GITHUB_REF:-}'"
            exit 1
          fi
          echo "Manual sync ref is refs/heads/main"

      - name: Run OpenCode Sync (manual)
        if: github.event_name == 'workflow_dispatch' && steps.upstream.outputs.has_changes == 'true'
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          OPENCODE_MODEL: ${{ vars.OPENCODE_MODEL || 'deepseek/deepseek-v4-flash' }}
          EXPECTED_UPSTREAM_SHA: ${{ steps.upstream.outputs.upstream_sha }}
        run: |
          npm install -g opencode-ai@latest
          opencode run --dangerously-skip-permissions -m "$OPENCODE_MODEL" \
            "Read .opencode/command/sync-upstream.md and follow ALL steps. Use python3. No tags. Stop if no upstream changes. Do not push; the workflow verifies and pushes after OpenCode exits. The immutable upstream commit for this run is $EXPECTED_UPSTREAM_SHA. The workflow injected EXPECTED_UPSTREAM_SHA; follow the command's Actions fail-closed contract. CRITICAL: preserve a real merge commit whose second parent is that SHA. Never reset, rebase, squash, cherry-pick, switch branches, or clear MERGE_HEAD after merge starts. Do not report success unless the recorded SHA is an ancestor of HEAD. CRITICAL: Step 4 must scan ALL .md files in the entire repo, including root .md files, skills/ppt-master/, docs/, examples/, projects/, and any other directory with .md files; exclude only .opencode/, docs/superpowers/, and docs/zh/upstream-sync.md. Before committing, require zero python3 remnants with rg, the skill integrity guard, all fork adaptation and fork notice markers, py_compile for the eight fork-modified Python files, and uvx ruff check --select F821 on those files. Do NOT commit or push until every gate passes."

      - name: Verify upstream ancestry
        if: github.event_name == 'workflow_dispatch' && steps.upstream.outputs.has_changes == 'true'
        env:
          BASE_SHA: ${{ github.sha }}
          EXPECTED_UPSTREAM_SHA: ${{ steps.upstream.outputs.upstream_sha }}
        run: |
          if ! (git diff --quiet && git diff --cached --quiet); then
            echo "::error::OpenCode left the worktree or index dirty"
            git status --short
            exit 1
          fi
          if ! WORKTREE_STATUS=$(git status --porcelain=v1 --untracked-files=all); then
            echo "::error::Unable to inspect the complete worktree status"
            exit 1
          fi
          if [ -n "$WORKTREE_STATUS" ]; then
            echo "::error::OpenCode left tracked or untracked worktree changes"
            printf '%s\n' "$WORKTREE_STATUS"
            exit 1
          fi

          if [ -z "${BASE_SHA:-}" ] || [ -z "${EXPECTED_UPSTREAM_SHA:-}" ]; then
            echo "::error::BASE_SHA and EXPECTED_UPSTREAM_SHA are required"
            exit 1
          fi
          if ! printf '%s\n' "$EXPECTED_UPSTREAM_SHA" | grep -Eq '^[0-9a-f]{40}$'; then
            echo "::error::Invalid expected upstream SHA: $EXPECTED_UPSTREAM_SHA"
            exit 1
          fi

          if ! git cat-file -e "HEAD:.github/upstream-main.sha"; then
            echo "::error::HEAD does not contain .github/upstream-main.sha"
            exit 1
          fi
          if ! RECORDED_SHA=$(git show HEAD:.github/upstream-main.sha | tr -d '\r\n'); then
            echo "::error::Unable to read committed upstream marker from HEAD"
            exit 1
          fi
          if [ "$RECORDED_SHA" != "$EXPECTED_UPSTREAM_SHA" ]; then
            echo "::error::Recorded SHA $RECORDED_SHA does not match expected $EXPECTED_UPSTREAM_SHA"
            exit 1
          fi

          if ! git merge-base --is-ancestor "$BASE_SHA" HEAD; then
            echo "::error::BASE_SHA is not an ancestor of HEAD"
            git log --graph --oneline --decorate "$BASE_SHA..HEAD"
            exit 1
          fi
          if ! git merge-base --is-ancestor "$EXPECTED_UPSTREAM_SHA" HEAD; then
            echo "::error::Expected upstream SHA is not an ancestor of HEAD"
            git log --graph --oneline --decorate "$BASE_SHA..HEAD"
            exit 1
          fi

          if ! MERGE_LINES=$(git rev-list --merges --parents "$BASE_SHA..HEAD"); then
            echo "::error::Unable to enumerate merge commits after BASE_SHA"
            exit 1
          fi
          if ! MATCHES=$(printf '%s\n' "$MERGE_LINES" | awk -v base="$BASE_SHA" -v expected="$EXPECTED_UPSTREAM_SHA" 'NF == 3 && $2 == base && $3 == expected { print $1 }'); then
            echo "::error::Unable to inspect merge commit parents"
            exit 1
          fi
          if ! MATCH_COUNT=$(printf '%s\n' "$MATCHES" | awk 'NF { count += 1 } END { print count + 0 }'); then
            echo "::error::Unable to count matching merge commits"
            exit 1
          fi
          if [ "$MATCH_COUNT" -ne 1 ]; then
            echo "::error::Expected exactly one two-parent merge with ^1=$BASE_SHA and ^2=$EXPECTED_UPSTREAM_SHA; found $MATCH_COUNT"
            git log --graph --oneline --decorate "$BASE_SHA..HEAD"
            exit 1
          fi
          MERGE_COMMIT="$MATCHES"
          echo "Verified two-parent merge commit $MERGE_COMMIT with ^1=$BASE_SHA and ^2=$EXPECTED_UPSTREAM_SHA"

      - name: Push verified manual sync
        if: github.event_name == 'workflow_dispatch' && steps.upstream.outputs.has_changes == 'true'
        env:
          PUSH_PAT: ${{ secrets.PUSH_PAT }}
        run: |
          if [ -z "${PUSH_PAT:-}" ]; then
            echo "::error::PUSH_PAT is required for the verified manual push"
            exit 1
          fi
          git remote set-url origin "https://x-access-token:${PUSH_PAT}@github.com/elvisw/ppt-master.git"
          git push origin HEAD:main
