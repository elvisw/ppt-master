name: Publish to PyPI

on:
  workflow_dispatch:
    inputs:
      release_sha:
        description: "Verified commit SHA pointed to by the release tag"
        required: true
        type: string
      release_tag:
        description: "Release tag, for example v0.1.121"
        required: true
        type: string
  push:
    tags:
      - "v*"

concurrency:
  group: publish-${{ github.event_name == 'workflow_dispatch' && inputs.release_tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Validate release identity
        env:
          RELEASE_SHA: ${{ github.event_name == 'workflow_dispatch' && inputs.release_sha || github.sha }}
          RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.release_tag || github.ref_name }}
        run: |
          set -euo pipefail
          if [[ -z "$RELEASE_SHA" || ! "$RELEASE_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::release_sha must be a non-empty 40-character lowercase SHA"
            exit 1
          fi
          if [[ -z "$RELEASE_TAG" || ! "$RELEASE_TAG" =~ ^v[0-9]+([.][0-9]+)+([._-][0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::release_tag has an invalid format"
            exit 1
          fi
          if [ "${GITHUB_EVENT_NAME:-}" = "push" ] &&
             [ "${GITHUB_REF:-}" != "refs/tags/$RELEASE_TAG" ]; then
            echo "::error::Tag push identity does not match the release tag"
            exit 1
          fi
          if [ "${GITHUB_EVENT_NAME:-}" = "workflow_dispatch" ] &&
             [ "${GITHUB_REF:-}" != "refs/tags/$RELEASE_TAG" ]; then
            echo "::error::Manual publish must be dispatched from the release tag ref"
            exit 1
          fi
          printf 'RELEASE_SHA=%s\nRELEASE_TAG=%s\n' "$RELEASE_SHA" "$RELEASE_TAG" >> "$GITHUB_ENV"

      - name: Checkout tag commit
        if: github.event_name == 'push'
        uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Checkout immutable manual release commit
        if: github.event_name == 'workflow_dispatch'
        uses: actions/checkout@v6
        with:
          ref: ${{ inputs.release_sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Fetch release gate refs
        env:
          RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.release_tag || github.ref_name }}
        run: |
          set -euo pipefail
          git fetch --no-tags origin main
          git remote add upstream https://github.com/hugohe3/ppt-master.git
          git fetch --no-tags upstream main
          git tag -d "$RELEASE_TAG" >/dev/null 2>&1 || true
          git fetch --no-tags origin "refs/tags/$RELEASE_TAG:refs/tags/$RELEASE_TAG"

      - name: Verify selected publish commit
        env:
          RELEASE_SHA: ${{ github.event_name == 'workflow_dispatch' && inputs.release_sha || github.sha }}
          RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.release_tag || github.ref_name }}
        run: |
          set -euo pipefail
          if ! git cat-file -e "${RELEASE_SHA}^{commit}"; then
            echo "::error::Selected publish commit is unavailable"
            exit 1
          fi
          if [ "$(git rev-parse HEAD)" != "$RELEASE_SHA" ]; then
            echo "::error::Checked out commit does not match the selected publish commit"
            exit 1
          fi
          if [ "$(git rev-parse "${RELEASE_TAG}^{commit}")" != "$RELEASE_SHA" ]; then
            echo "::error::Remote release tag does not point to release_sha"
            exit 1
          fi
          if [ "${GITHUB_EVENT_NAME:-}" = "push" ] && [ "$GITHUB_SHA" != "$RELEASE_SHA" ]; then
            echo "::error::Tag event SHA does not match release_sha"
            exit 1
          fi

      - name: Verify recorded upstream ancestry
        env:
          RELEASE_SHA: ${{ github.event_name == 'workflow_dispatch' && inputs.release_sha || github.sha }}
        run: |
          python3 .github/scripts/check_upstream_ancestry.py \
            --repo "$GITHUB_WORKSPACE" \
            --head-sha "$RELEASE_SHA" \
            --upstream-ref upstream/main

      - name: Run uvx migration check
        run: |
          EXIT=0
          python3 skills/ppt-master/scripts/check_uvx_migration.py HEAD || EXIT=$?
          if [ "$EXIT" -eq 2 ]; then
            echo "::notice::Not a merge commit — skipped (no upstream code to check)"
          elif [ "$EXIT" -ne 0 ]; then
            echo "::error::python3 remnants found in merge commit — uvx adaptation incomplete"
            exit 1
          fi
      - uses: astral-sh/setup-uv@v5

      - name: Verify version matches tag
        env:
          RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.release_tag || github.ref_name }}
        run: |
          set -euo pipefail
          ROOT_VERSION=$(python3 -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          SKILLS_VERSION=$(python3 -c "import tomllib; print(tomllib.load(open('skills/ppt-master/pyproject.toml','rb'))['project']['version'])")
          TAG_VERSION="${RELEASE_TAG#v}"
          if [ "$TAG_VERSION" != "$ROOT_VERSION" ]; then
            echo "::error::Tag v${TAG_VERSION} != pyproject.toml version ${ROOT_VERSION}"
            exit 1
          fi
          if [ "$ROOT_VERSION" != "$SKILLS_VERSION" ]; then
            echo "::error::Root version ${ROOT_VERSION} != skills version ${SKILLS_VERSION}"
            exit 1
          fi
          echo "Version check passed: ${ROOT_VERSION}"

      - run: uv build

      - name: Verify wheel passes skill integrity guard
        run: |
          uvx --from dist/ppt_master-*.whl ppt-master attribution-guard
          if [ $? -ne 0 ]; then
            echo "::error::Built wheel failed attribution_guard — do not publish."
            exit 1
          fi
          echo "✅ Wheel-level integrity guard passed"

      - run: uv publish
